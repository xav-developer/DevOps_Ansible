---
-   name: Validate k8s_apiserver_cert_extra_sans is set
    ansible.builtin.assert:
        that:
            - k8s_apiserver_cert_extra_sans is defined
            - k8s_apiserver_cert_extra_sans | length > 0
        fail_msg: "Set k8s_apiserver_cert_extra_sans (e.g. devops.example.tld)"

-   name: Dry-run kubeadm init
    ansible.builtin.command: "kubeadm init --dry-run --apiserver-cert-extra-sans={{ k8s_apiserver_cert_extra_sans }}"
    register: kubeadm_dry_run
    changed_when: false
    when: k8s_kubeadm_dry_run | bool

-   name: Check if cluster already initialized
    ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
    register: k8s_admin_conf

-   name: kubeadm init
    ansible.builtin.command: "kubeadm init --apiserver-cert-extra-sans={{ k8s_apiserver_cert_extra_sans }}"
    register: kubeadm_init_result
    changed_when: true
    when:
        - not (k8s_kubeadm_dry_run | bool)
        - not k8s_admin_conf.stat.exists

-   name: Generate worker join command (only when needed)
    ansible.builtin.command: "kubeadm token create --print-join-command"
    register: k8s_join_worker_cmd
    changed_when: false
    when:
        - not (k8s_kubeadm_dry_run | bool)
        - (kubeadm_init_result is defined) or (k8s_kubeadm_refresh_join_commands | bool)

-   name: Upload certs and get certificate key for control-plane join (only when needed)
    ansible.builtin.command: "kubeadm init phase upload-certs --upload-certs"
    register: k8s_upload_certs
    changed_when: false
    when:
        - not (k8s_kubeadm_dry_run | bool)
        - (kubeadm_init_result is defined) or (k8s_kubeadm_refresh_join_commands | bool)

-   name: Build control-plane join command
    ansible.builtin.set_fact:
        k8s_join_command_worker: "{{ k8s_join_worker_cmd.stdout | trim }}"
        k8s_join_command_control_plane: "{{ (k8s_join_worker_cmd.stdout | trim) ~ ' --control-plane --certificate-key ' ~ (k8s_upload_certs.stdout_lines | last | trim) }}"
    when:
        - not (k8s_kubeadm_dry_run | bool)
        - k8s_join_worker_cmd.stdout is defined
        - k8s_upload_certs.stdout_lines is defined
        - (k8s_upload_certs.stdout_lines | length) > 0
