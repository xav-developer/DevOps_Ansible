---
-   name: Check if node already joined (kubelet.conf exists)
    ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
    register: k8s_kubelet_conf

-   name: Join worker to cluster
    ansible.builtin.command: "{{ hostvars[groups['kube_control_plane'][0]].k8s_join_command_worker }}"
    when:
        - not k8s_kubelet_conf.stat.exists
        - hostvars[groups['kube_control_plane'][0]].k8s_join_command_worker is defined
