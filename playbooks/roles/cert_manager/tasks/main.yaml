---
-   name: Apply cert-manager CRDs
    ansible.builtin.command:
        cmd: kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.crds.yaml
    changed_when: true

-   name: Add Jetstack Helm repository
    ansible.builtin.command:
        cmd: helm repo add jetstack https://charts.jetstack.io
    changed_when: true

-   name: Update Helm repositories
    ansible.builtin.command:
        cmd: helm repo update
    changed_when: true

-   name: Install cert-manager
    ansible.builtin.command:
        cmd: helm upgrade --install cert-manager jetstack/cert-manager --create-namespace --namespace cert-manager
    changed_when: true
