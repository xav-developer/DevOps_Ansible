---
-   name: Apply local-path-provisioner manifest
    ansible.builtin.command:
        cmd: kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/master/deploy/local-path-storage.yaml
    changed_when: true

-   name: Set local-path as default StorageClass
    ansible.builtin.command:
        cmd: >-
            kubectl patch sc local-path
            --patch '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
    changed_when: true
